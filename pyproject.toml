[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "looselips-guard"
version = "0.1.0"
description = "Stops your coding agent publishing your data to the world"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["security", "agent", "hooks", "egress", "claude-code", "codex", "cursor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
]

# `looselips` on PyPI is an unrelated project; this is `looselips-guard`
# throughout. The importable module is `looselips_guard` (underscore).
[project.scripts]
looselips-guard = "looselips_guard:main"

[project.urls]
Homepage = "https://github.com/ed-is-ai/looselips-guard"

[tool.setuptools]
py-modules = ["looselips_guard", "gitleaks_rules"]
